<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Crypto Fees</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="topbar">
        <label>Valuta <select id="currency"></select></label>
        <button id="options" type="button" title="Avvisi e impostazioni" aria-label="Impostazioni">⚙</button>
    </div>
    <section>
        <h2>BTC <small>sat/vB</small></h2>
        <div class="price" id="btc-price" aria-live="polite"></div>
        <dl id="btc-fees" aria-live="polite"></dl>
    </section>
    <hr>
    <section>
        <h2><select id="chain" aria-label="Rete EVM"></select> <small>Gwei</small></h2>
        <div class="price" id="eth-price" aria-live="polite"></div>
        <dl id="eth-fees" aria-live="polite"></dl>
        <p class="note" id="l2-note" hidden>Costo stimato: solo gas L2, esclusa la fee dati L1.</p>
    </section>
    <hr>
    <section>
        <h2>Oro <small>/oz</small></h2>
        <div class="price" id="gold-price" aria-live="polite"></div>
    </section>
    <footer>
        <span id="updated"></span>
        <button id="refresh" type="button">Aggiorna</button>
    </footer>
    <script type="module" src="popup.js"></script>
</body>
</html>
