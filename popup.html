<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Crypto Fees</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="topbar">
        <label><span data-i18n="currency"></span> <select id="currency"></select></label>
        <button id="options" type="button" data-i18n-title="settings" data-i18n-aria="settingsAria">⚙</button>
    </div>
    <section>
        <h2>BTC <small>sat/vB</small></h2>
        <div class="price" id="btc-price" aria-live="polite"></div>
        <dl id="btc-fees" aria-live="polite"></dl>
    </section>
    <hr>
    <section>
        <h2><select id="chain" data-i18n-aria="evmNetwork"></select> <small>Gwei</small></h2>
        <div class="price" id="eth-price" aria-live="polite"></div>
        <dl id="eth-fees" aria-live="polite"></dl>
        <p class="note" id="l2-note" data-i18n="l2note" hidden></p>
    </section>
    <hr>
    <section>
        <h2><span data-i18n="gold"></span> <small>/oz</small></h2>
        <div class="price" id="gold-price" aria-live="polite"></div>
    </section>
    <footer>
        <span id="updated"></span>
        <button id="refresh" type="button" data-i18n="refresh"></button>
    </footer>
    <script type="module" src="popup.js"></script>
</body>
</html>
